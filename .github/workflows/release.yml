name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each template
        run: |
          (cd slides && zip -r ../decarb-slides.zip . -x '*.pdf')
          (cd poster && zip -r ../decarb-poster.zip . -x 'poster.pdf' 'poster.png' '__pycache__/*')
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            decarb-slides.zip
            decarb-poster.zip
